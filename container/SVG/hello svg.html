<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
body{
    background: hsl(210deg 15% 6%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    min-height : 100vh;
    color: white;
}
body::before{
    content: 'hover/tap/focus/that element';
    display: block;
    text-align: center;
}
button{
    display: block;
    background: none;
    border: 1px solid hsl(209, 67%, 48%);
}
svg{
     display: block;
}

circle{
    fill: hotpink;
    transition: r 400ms, cy 600ms;
}
button:hover circle,
  button:focus-visible circle {
    r: 50px;
    cy: 100px;
  }
   
    </style>
     <button>
        <svg width="100" height="100">
          <circle
        
          r="30"
          cx="50"
          cy="50"
          />
        </svg>
     </button> 
</body>
</html>
