<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <style>
 :root {
    --badge-dark:#4a3520;
    --badge-mid:#6b4a28;
    --badge-light:#a6743f;
    --badge-rim: #f2c368;
    --hp-red-top:#ef4b4b;
     --hp-red-bottom:#b3161c;
    --hp-red-shine:#ff8a8a;
    --mana-green-top:#6fe89a;
    --mana-green-bottom:#17a866;
    --mana-green-shine:#b9ffd6;
   --energy-yellow-top:#ffe066;
   --energy-yellow-bottom:#e69b0e;
   --energy-yellow-shine:#fff6c2;
    --bar-outline:#26160c;
    --text-cream:#fff6df;
 }
 *{
    box-sizing: border-box;
 }
body{
    margin: 0;
    min-height: 100vh; 
    font-family: Arial, sans-serif;
    background-color: lightblue;
 }    
.stats{
    position: fixed;
     top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    width: clamp(260px, 90vw, 520px);
}
.badge-wrap{
  position: relative;
  z-index: 3;
  width: 84px;
  height: 84px;
  flex-shrink: 0;
  margin-right: -30px;
  
 
}
.badge{
  position: relative;
  width: 100%;
  height: 100%;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(
    145deg, var(--badge-light) 0%, var(--badge-mid) 55% , var(--badge-dark) 100%
  );
  box-shadow: 
  1px 1px 1px 5px var(--badge-rim),
  1px 1px 1px 5px  var(--badge-dark),
  0 7px 10px black;
  
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-circle{
  width: 55px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
   background: radial-gradient(circle at 33% 30%, rgb(211, 180, 124), rgb(175, 130, 45) 65%, #864b4b 100%  );
  display: flex;
  justify-content: center;
    align-items: center;
}
.icon{
  font-size: 25px;
}
.level-circle{
  position: absolute;
  bottom: -10px;
  left: 25px;
  z-index: 4;
  width: 30px;
  aspect-ratio: 1 / 1;
  font-size: 13px;
  border-radius: 50%;

  background: linear-gradient(150deg, var(--badge-light) 0%,  var(--badge-mid) 80%, var(--badge-dark) 100%);
  border: 4px solid var(--badge-rim);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text-cream);
  font-family: Verdana,  sans-serif;
  font-weight: bold;
  text-shadow: 0 1px black, 0 0 3px black;
  box-shadow: 0 3px 5px black, inset 0 2px 1px grey;
}
.bars{
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-left: 30px;
}
.bar{
  position: relative;
  height: 30px;
  width: 100%;
  border: 3px solid var(--bar-outline);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px grey, inset 0 -5px 6px black, 0 3px 4px black;
}
.bar-fill{
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1;

}
.hp .bar-fill{
  background: linear-gradient(180deg,  var(--hp-red-shine) 0%, var(--hp-red-top) 25%, var(--hp-red-bottom) 100% )
}

.mana .bar-fill{
 background: linear-gradient(180deg, var(--mana-green-shine) 0%, var(--mana-green-top) 25%, var(--mana-green-bottom) 100%);
}
.mana{
  height: 22px;
}

.energy .bar-fill{
   background: linear-gradient(180deg, var(--energy-yellow-shine) 0%, var(--energy-yellow-top) 25%, var(--energy-yellow-bottom) 100%);
}
.energy{
  height: 20px;
}
.bar-fill::before{
  content: "";
  position: absolute;
  top: 3px; 
   left: 6px;
  right: 6px;
  height: 35%;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 50px;
  filter: blur(1.1px);
}
.bar-text{
  position: relative;
  z-index: 3;
  font-weight: 800;
  color: var(--text-cream);
  letter-spacing: 1px;
  text-shadow: 0 2px 0 black,  0 1px 3px black;
}
.hp .bar-text{
  font-size: 16px;
}
.mana .bar-text{
    font-size: 12px;
}
.energy .bar-text{
   font-size:8px;
   color: rgb(77, 55, 14);
   text-shadow: 0 1px 1px grey;
}
.bar-back {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.1) 0,
        rgba(255, 255, 255, 0.1) 2px,
        transparent 2px,
        transparent 20px
    );
    z-index: 2;
    pointer-events: none;
}
.bar.flash .bar-fill{
   animation: hitFlash 0.25s ease-out
}
@keyframes hitFlash{
  0%{
    filter: brightness(2.5)
  }
  100%{
     filter: brightness(1)
  }
}
.bar.low-hp{
    animation: lowPulse 1s ease-in-out infinite;
}
@keyframes  lowPulse{
  0%, 100%{
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.8), 0 0 4px rgba(255,0,0,0.4);
   }
   50%{
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.8), 0 0 14px rgba(255,0,0,0.9);
   }
}
      
 </style>
     <canvas id="canvas-game"></canvas>
     <div class="stats">
    <div class="badge-wrap">
      <div class="badge">
         <div class="icon-circle">
            <div class="icon">🐻</div>
         </div>
        </div> 
      <div class="level-circle"  id="level-circle"></div>
       </div>
    <div class="bars">
      <div class="bar hp" id="bar-hp">
        <div class="bar-fill" id="bar-fill-hp">
          <span class="bar-text" id="bar-text-hp"></span>
        </div>
        <div class="bar-back"></div>
      </div>
       <div class="bar mana" id="bar-mana">
        <div class="bar-fill" id="bar-fill-mana">
          <span class="bar-text" id="bar-text-mana"></span>
        </div>
        <div class="bar-back"></div> 
        </div>
       <div class="bar energy" id="bar-text-energy">
        <div class="bar-fill" "bar-fill-energy">
          <span class="bar-text"  id="bar-text-energy"></span>
        </div>
        <div class="bar-back"></div>
           </div>
    </div>
    </div>
    
</body>
</html>
